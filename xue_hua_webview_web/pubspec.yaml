name: xue_hua_webview_web
description: A Flutter plugin that provides a WebView widget on web.
repository: https://github.com/Matkurban/xue_hua_webview
homepage: https://github.com/Matkurban/xue_hua_webview
issue_tracker: https://github.com/Matkurban/xue_hua_webview/issues
version: 1.0.1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

flutter:
  plugin:
    implements: xue_hua_webview
    platforms:
      web:
        pluginClass: WebWebViewPlatform
        fileName: xue_hua_webview_web.dart

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.1.1
  xue_hua_webview_platform_interface: ^1.0.0

dev_dependencies:
  build_runner: ^2.1.5
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4

topics:
  - webview
  - webview-flutter
  - html
  - web
  - browser

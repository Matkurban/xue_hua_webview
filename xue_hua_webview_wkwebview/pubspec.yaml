name: xue_hua_webview_wkwebview
description: A Flutter plugin that provides a WebView widget based on Apple's WKWebView control.
repository: https://github.com/Matkurban/xue_hua_webview
homepage: https://github.com/Matkurban/xue_hua_webview
issue_tracker: https://github.com/Matkurban/xue_hua_webview/issues
version: 1.0.3

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

flutter:
  plugin:
    implements: xue_hua_webview
    platforms:
      ios:
        pluginClass: WebViewFlutterPlugin
        dartPluginClass: WebKitWebViewPlatform
        sharedDarwinSource: true
      macos:
        pluginClass: WebViewFlutterPlugin
        dartPluginClass: WebKitWebViewPlatform
        sharedDarwinSource: true

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.10.0
  path: ^1.8.0
  xue_hua_webview_platform_interface: ^1.0.0

dev_dependencies:
  build_runner: ^2.1.5
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4
  pigeon: ^26.1.4

topics:
  - webview
  - webview-flutter
  - ios
  - macos
  - wkwebview

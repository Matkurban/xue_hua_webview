name: xue_hua_webview_android
description: A Flutter plugin that provides a WebView widget on Android.
repository: https://github.com/Matkurban/xue_hua_webview
homepage: https://github.com/Matkurban/xue_hua_webview
issue_tracker: https://github.com/Matkurban/xue_hua_webview/issues
version: 1.1.0

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

flutter:
  plugin:
    implements: xue_hua_webview
    platforms:
      android:
        package: com.kurban.xue_hua_webview_android
        pluginClass: WebViewFlutterPlugin
        dartPluginClass: AndroidWebViewPlatform

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.18.3
  xue_hua_webview_platform_interface: ^1.0.2

dev_dependencies:
  build_runner: ^2.16.1
  flutter_test:
    sdk: flutter
  mockito: ^5.8.1
  pigeon: ^28.0.0

dependency_overrides:
  meta: 1.18.3

topics:
  - webview
  - webview-flutter
  - android
  - html
  - browser
